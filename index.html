<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Warning</title>
  <meta name="robots" content="noindex,nofollow" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* Modal Overlay */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* Modal Box */
    .modal {
      background: white;
      border-radius: 12px;
      max-width: 500px;
      width: 90%;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
      animation: slideUp 0.4s ease;
      overflow: hidden;
    }

    @keyframes slideUp {
      from {
        transform: translateY(50px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    /* Modal Header */
    .modal-header {
      background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%);
      padding: 24px;
      text-align: center;
    }

    .warning-icon {
      font-size: 48px;
      margin-bottom: 8px;
    }

    .modal-header h1 {
      color: white;
      font-size: 24px;
      font-weight: 600;
      margin: 0;
    }

    /* Modal Body */
    .modal-body {
      padding: 28px 24px;
      color: #333;
      line-height: 1.6;
      text-align: center;
    }

    .modal-body p {
      margin-bottom: 16px;
      font-size: 18px;
      font-weight: 500;
    }

    .modal-body p:last-child {
      margin-bottom: 0;
    }

    /* Modal Footer */
    .modal-footer {
      padding: 20px 24px;
      background: #f8f9fa;
      text-align: center;
      border-top: 1px solid #e9ecef;
    }

    .btn {
      background: #2a5298;
      color: white;
      border: none;
      padding: 12px 32px;
      font-size: 15px;
      font-weight: 500;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
      margin: 0 8px;
    }

    .btn:hover {
      background: #1e3c72;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(42, 82, 152, 0.3);
    }

    .btn-secondary {
      background: #6c757d;
    }

    .btn-secondary:hover {
      background: #5a6268;
    }

    /* Background Content */
    .background-content {
      text-align: center;
      color: white;
      opacity: 0.3;
    }

    .background-content h2 {
      font-size: 36px;
      margin-bottom: 16px;
    }

    /* Hidden class for modal */
    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <!-- Modal Popup -->
  <div class="modal-overlay" id="warningModal">
    <div class="modal">
      <div class="modal-header">
        <div class="warning-icon">🚫</div>
        <h1>Warning</h1>
      </div>
      <div class="modal-body">
        <p>Do not open this link!</p>
      </div>
      <div class="modal-footer">
        <button class="btn" onclick="closeModal()">Continue Anyway</button>
        <button class="btn btn-secondary" onclick="goBack()">Go Back</button>
      </div>
    </div>
  </div>

  <!-- Background Content (shown after modal is closed) -->
  <div class="background-content">
    <h2>⚠️</h2>
  </div>

  <script>
    // Modal functions
    function closeModal() {
      document.getElementById('warningModal').classList.add('hidden');
    }

    function goBack() {
      window.history.back();
      // If no history, close tab after 500ms
      setTimeout(function() {
        window.close();
      }, 500);
    }

    // Optional: Prevent modal from being closed by clicking outside
    document.getElementById('warningModal').addEventListener('click', function(e) {
      if (e.target === this) {
        // Uncomment the line below to allow closing by clicking outside
        // closeModal();
      }
    });
  </script>
</body>
</html>
